# walt.id verifier-api2 configuration for the bridge's docker-compose example (image 1.2.0).
# Placeholder values only: replace every <...>. Never commit real keys or certificates.

# Shown by the wallet when it asks the holder to present.
clientMetadata: {
   client_name: "<site name>"
   # logo_uri: "https://<verifier-public-host>/logo.png"
}

# Public base of the wallet-facing endpoints. request_uri and response_uri are built from it,
# so it must be the HTTPS address wallets reach through your reverse proxy.
urlPrefix: "https://<verifier-public-host>/verification-session"

# Scheme of the authorization request URL the bridge hands WordPress (the QR code).
urlHost: "openid4vp://authorize"

# Unsigned mode (default): omit clientId, key and x5c; the bridge leaves signed_request unset.
# For signed mode, generate private/verifier-service.conf with configure-signing.mjs,
# mount it over this file (see docker-compose.example.yml), and set
# VERIFIER_SIGNED_REQUEST=true on the bridge. The generated JSON is valid HOCON.
# It contains clientId (x509_san_dns:<DNS SAN> or x509_hash:<base64url SHA-256 of leaf DER>),
# key ({type: "jwk", jwk: <private P-256 JWK>}) and x5c (base64 DER, leaf first).
