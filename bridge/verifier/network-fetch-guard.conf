# Read by walt.id versions after 1.2.0 (1.2.0 ignores it): where the verifier may send outbound
# requests it was given URLs for, including session webhooks. The bridge's callback URL is a
# private address on the Compose network, so private networks must be allowed. Loopback,
# link-local and cloud-metadata addresses stay refused.
allowLoopback = false
allowPrivateNetworks = true
trustedHostSuffixes = []
