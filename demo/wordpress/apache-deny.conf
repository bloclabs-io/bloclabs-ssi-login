# The checkout is mounted as the plugin so WordPress can run it.
# The demo tree and git metadata are not part of the plugin.
<Directory "/var/www/html/wp-content/plugins/bloclabs-ssi-login/demo">
	Require all denied
</Directory>
<DirectoryMatch "^/var/www/html/wp-content/plugins/bloclabs-ssi-login/\.git">
	Require all denied
</DirectoryMatch>
