include "/runtime/issuer-key.conf"

profiles = {
  member = {
    name = "blocLabs member"
    credentialConfigurationId = "member"
    issuerKey = ${issuerKey}
    issuerDid = ${issuerDid}
    credentialData = {
      given_name = "Ada"
      family_name = "Lovelace"
      email = "ada@example.com"
      name = "Ada Lovelace"
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }
    selectiveDisclosure = {
      fields = {
        given_name = { sd = true }
        family_name = { sd = true }
        email = { sd = true }
        name = { sd = true }
      }
      decoyMode = "NONE"
      decoys = 0
    }
  }
}
