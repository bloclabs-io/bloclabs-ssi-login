include "/runtime/issuer-key.conf"

profiles = {
  member = {
    name = "blocLabs member"
    credentialConfigurationId = "member"
    issuerKey = ${issuerKey}
    issuerDid = ${issuerDid}
    credentialData = {
      given_name = "Ada"
      family_name = "Lovelace"
      email = "ada@example.com"
      name = "Ada Lovelace"
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }
    selectiveDisclosure = {
      fields = {
        given_name = { sd = true }
        family_name = { sd = true }
        email = { sd = true }
        name = { sd = true }
      }
      decoyMode = "NONE"
      decoys = 0
    }
  }

  # The agent credential (ADR 0007): who the agent is, who it acts for, what
  # it may ask for. acts_for is empty by default (the agent's own key is what
  # a site links to an account); demo/agent.sh --acts-for sets it per offer.
  agent = {
    name = "blocLabs agent"
    credentialConfigurationId = "agent"
    issuerKey = ${issuerKey}
    issuerDid = ${issuerDid}
    credentialData = {
      acts_for = ""
      scope = ["read", "content"]
      agent = {
        name = "Nightly backup"
        operator = "blocLabs demo"
      }
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:30d>"
    }
    selectiveDisclosure = {
      fields = {
        acts_for = { sd = true }
        scope = { sd = true }
        agent = { sd = true }
      }
      decoyMode = "NONE"
      decoys = 0
    }
  }
}
