issuerDisplay = [
  {
    name = "blocLabs"
    locale = "en"
  }
]

credentialConfigurations = {
  member = {
    format = "dc+sd-jwt"
    scope = "member"
    vct = "vctBaseUrl"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk", "did:jwk"]
    proof_types_supported = {
      jwt = { proof_signing_alg_values_supported = ["ES256"] }
    }
    credential_metadata = {
      display = [{
        name = "blocLabs member"
        locale = "en"
        description = "Demo membership credential"
        background_color = "#ff782d"
        text_color = "#333333"
      }]
      claims = [
        { path = ["given_name"], display = [{ name = "Given name", locale = "en" }] }
        { path = ["family_name"], display = [{ name = "Family name", locale = "en" }] }
        { path = ["email"], display = [{ name = "Email", locale = "en" }] }
        { path = ["name"], display = [{ name = "Name", locale = "en" }] }
      ]
    }
  }
  agent = {
    format = "dc+sd-jwt"
    scope = "agent"
    vct = "vctBaseUrl"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk", "did:jwk"]
    proof_types_supported = {
      jwt = { proof_signing_alg_values_supported = ["ES256"] }
    }
    credential_metadata = {
      display = [{
        name = "blocLabs agent"
        locale = "en"
        description = "Demo agent credential: a software agent and who it acts for"
        background_color = "#ff782d"
        text_color = "#333333"
      }]
      claims = [
        { path = ["acts_for"], display = [{ name = "Acts for", locale = "en" }] }
        { path = ["scope"], display = [{ name = "Scope", locale = "en" }] }
        { path = ["agent", "name"], display = [{ name = "Agent", locale = "en" }] }
        { path = ["agent", "operator"], display = [{ name = "Operator", locale = "en" }] }
      ]
    }
  }
}
